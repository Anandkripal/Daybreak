name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s analytics/tests -v
      - run: python analytics/export_bi.py
      - run: git diff --exit-code -- analytics/exports
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: daybreak
          POSTGRES_PASSWORD: daybreak
          POSTGRES_DB: daybreak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: mypy daybreak_api
      - run: pytest -q
        env:
          DATABASE_TEST_URL: postgresql+psycopg://daybreak:daybreak@localhost:5432/daybreak_test
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Firefox browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/daybreak-browser" --no-save playwright@1.65.1 @axe-core/playwright@4.14.0
          "$RUNNER_TEMP/daybreak-browser/node_modules/.bin/playwright" install --with-deps firefox
      - name: Verify private journeys in Firefox
        env:
          BROWSER: firefox
        run: |
          node node_modules/next/dist/bin/next start --hostname localhost --port 3027 > "$RUNNER_TEMP/daybreak-web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 12 --retry-connrefused --retry-delay 1 --fail --silent --show-error http://localhost:3027/health
          NODE_PATH="$RUNNER_TEMP/daybreak-browser/node_modules" node e2e/private-journey.cjs
